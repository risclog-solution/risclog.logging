[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "risclog.logging"
version = "3.0.0.dev0"
description = "A logger based on structlog"
dynamic = ["readme"]
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "riscLOG Solution GmbH", email = "info@risclog.de"},
]
keywords = ["risclog.logging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: German",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "stamina",
    "structlog",
]

[project.urls]
Homepage = "https://github.com/risclog-solution/risclog.logging"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[dependency-groups]
dev = [
    "risclog.logging[test]",
    "fastapi",
    "pre-commit",
    "pyrefly",
    "requests",
    "ruff==0.17.5",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["risclog.logging*"]
namespaces = true

[tool.setuptools.package-data]
"risclog.logging" = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst"}

[tool.pytest.ini_options]
testpaths = ["src"]
consider_namespace_packages = true
addopts = [
    "--tb=native",
    "--cov=risclog.logging",
    "--cov-config=pyproject.toml",
    "--cov-branch",
    "--cov-report=term-missing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

[tool.pyrefly]
python-version = "3.12"
project-includes = ["src/risclog/logging"]
project-excludes = [
    "src/risclog/logging/conftest.py",
    "src/risclog/logging/tests/**",
]

[tool.ruff]
target-version = "py312"
line-length = 79
extend-exclude = [".appenv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["risclog.logging"]

[tool.ruff.format]
quote-style = "preserve"

[tool.check-manifest]
ignore = [".editorconfig", ".pre-commit-config.yaml", ".python-version", "uv.lock"]

[tool.coverage.run]
relative_files = true
parallel = true
branch = true
source = ["risclog.logging"]

[tool.coverage.paths]
source = ["src", ".venv/lib/python*/site-packages"]

[tool.coverage.html]
directory = "coverage-report"

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true
exclude_lines = [
    # a more strict default pragma
    "\\# pragma: no cover\\b",

    # allow defensive code
    "^\\s*raise AssertionError\\b",
    "^\\s*raise NotImplementedError\\b",
    "^\\s*return NotImplemented\\b",
    "^\\s*raise$",

    # typing-related code
    "^if (False|TYPE_CHECKING):",
    ": \\.\\.\\.(\\s*#.*)?$",
    "^ +\\.\\.\\.$",
    "-> ['\"]?NoReturn['\"]?:",
]
